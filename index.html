<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Dark is the default; only an explicit "light" choice turns it off.
         Runs before first paint so there's no light flash on load. -->
    <script>
      try {
        if (localStorage.getItem('theme') === 'light')
          document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>

    <title>Alexander Tjernström · Fullstack Developer</title>
    <meta
      name="description"
      content="Alexander Tjernström, a fullstack developer based in Stockholm. Selected work, background, and how to reach me."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Alexander Tjernström" />
    <meta
      property="og:description"
      content="Fullstack developer based in Stockholm. Selected work, background, and how to reach me."
    />
    <meta property="og:site_name" content="Alexander Tjernström" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Alexander Tjernström" />
    <meta
      name="twitter:description"
      content="Fullstack developer based in Stockholm. Selected work, background, and how to reach me."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
